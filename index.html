
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111528" />
  <title>Binghayu-BBangD | 빙하유 궁둥이 두드리기</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./game.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Binghayu-<strong>BBangD</strong></span>
      </div>
      <div class="tagline">클릭 한 번, 외곽까지 출렁!</div>
    </header>

    <main>
      <section class="intro">
        <p class="eyebrow">BINGHAYU BBANGD · INTERACTIVE GAME</p>
        <h1>빙하유 궁둥이 <em>두드리기!</em></h1>
        <p>궁둥이를 클릭하거나 터치하면 둥근 외곽선까지 출렁이고, 두드릴 때마다 효과음이 납니다. 연타도 가능합니다.</p>
      </section>

      <section class="game-frame" aria-label="빙하유 궁둥이 두드리기 게임">
        <div class="game-scene" id="gameScene">
          <!-- WebGL을 지원하지 않는 브라우저에는 원본 이미지를 보여 줍니다. -->
          <img class="fallback-image" id="fallbackImage" src="./assets/composite_padded.png" alt="양손을 옆에 둔 동그란 검은색 옷의 캐릭터" />
          <canvas id="gameCanvas" tabindex="0" role="button" aria-label="궁둥이를 클릭하거나 스페이스바를 누르면 물결이 생깁니다"></canvas>
          <div class="scene-help" id="sceneHelp">👆 궁둥이를 콕 눌러보세요</div>
          <div class="error-message" id="errorMessage" role="status" hidden></div>
        </div>
        <div class="scene-footer">
          <span class="live-indicator"><span></span> PLAY MODE</span>
          <span>마우스 · 터치 지원</span>
        </div>
      </section>

      <section class="panel" aria-label="게임 설정">
        <div class="score-block">
          <span class="panel-label">두드린 횟수</span>
          <div class="score-value"><span id="hitCount">0</span><small>HITS</small></div>
          <button class="reset-button" id="resetButton" type="button">↻ 초기화</button>
        </div>
        <div class="controls">
          <label class="control">
            <span><strong>타격 강도</strong><output id="powerLabel">1.0×</output></span>
            <input id="power" type="range" min="0.4" max="2.2" step="0.1" value="1.0" />
            <small>클릭할 때 얼마나 크게 흔들릴지</small>
          </label>
          <label class="control">
            <span><strong>말랑함</strong><output id="jellyLabel">1.0×</output></span>
            <input id="jelly" type="range" min="0.5" max="1.8" step="0.1" value="1.0" />
            <small>높을수록 파동이 오래 지속됩니다</small>
          </label>
          <div class="control audio-control">
            <label class="control-heading" for="volume">
              <strong>효과음 볼륨</strong><output id="volumeLabel" for="volume">65%</output>
            </label>
            <input id="volume" type="range" min="0" max="100" step="1" value="65"
                   aria-label="효과음 볼륨" />
            <div class="audio-control-footer">
              <small>궁둥이를 때릴 때마다 효과음이 납니다</small>
              <button type="button" id="muteButton" class="mute-button" aria-pressed="false">
                🔊 소리 켜짐
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">원본 이미지 보존 · 궁둥이 외곽까지 변형 · WebGL2 실시간 렌더링</footer>
  </div>
</body>
</html>
